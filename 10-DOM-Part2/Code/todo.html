<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <style>
       /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Body Styling */
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Main Container */
.container {
    background: #ffffff;
    width: 100%;
    max-width: 500px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

/* Heading */
h1 {
    text-align: center;
    margin-bottom: 20px;
    color: white;
    position: absolute;
    top: 100px;
    font-size: 32px;
}

/* Form */
form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
}

/* Input */
#input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid #764ba2;
    outline: none;
    font-size: 16px;
}

#input:focus {
    border-color: #667eea;
}

/* Add Button */
button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

/* Task List */
#list {
    list-style: none;
}

#list li {
    background: #b3cdff;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s ease;
    font-weight: bold;
}

#list li:hover {
    background: #7e94df;
}

/* Remove Button */
#list li button {
    background: #ff4d4d;
    padding: 5px 10px;
    font-size: 14px;
}

#list li button:hover {
    background: #e60000;
}

/* Responsive */
@media (max-width: 480px) {
    .container {
        padding: 15px;
    }

    form {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
    </style>
</head>
<body>
    <h1>Todo App</h1>
    <div class="container">
        
        <form>
        
        <label for="">Enter Your Task: </label>
        <input type="text" placeholder="Enter Task" id="input">
        <button onclick="fun(event)">Add Task</button>
    </form>
    <ul id="list">

    </ul>
    </div>

    <script src="./todo.js"></script>
</body>
</html>
