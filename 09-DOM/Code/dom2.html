<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="heading">DOM</h1>
    <p class="para">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Nulla, architecto?</p>
    <h2 class="main">Nitish Kumar</h2>
    <div class="container">
        <h1 class="content">Hello</h1>
        <div id="section">
            <h1 class="content">Hello</h1>
        </div>
    </div>
    <button onclick="checkText()">Click</button>
    <h1 class="content">Good Morning</h1>

    <script>
        // let h1 = document.querySelector(".content"); // first element of class content 
        let h1 = document.querySelectorAll(".content");
        function checkText(){
            h1.forEach(element => {
                element.style.backgroundColor = "blue";
            });
        }
    </script>
</body>
</html>
